name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate XML, YAML, JSON, RAML
        run: python scripts/validate-artifacts.py

  mule-munit:
    runs-on: ubuntu-latest
    if: ${{ vars.MULE_EE_AVAILABLE == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: MUnit (requires MuleSoft Enterprise credentials)
        run: mvn -B -DskipTests=false test
        env:
          ANYPOINT_USERNAME: ${{ secrets.ANYPOINT_USERNAME }}
          ANYPOINT_PASSWORD: ${{ secrets.ANYPOINT_PASSWORD }}
