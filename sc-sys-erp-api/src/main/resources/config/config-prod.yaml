http:
  host: "0.0.0.0"
  port: "8081"
  basePath: "/api"
https:
  enabled: true
  port: "8443"
app:
  name: "sc-sys-erp-api"
  env: "prod"
apikit:
  consoleEnabled: false
objectstore:
  persistent: true
  maxEntries: "200000"
  entryTtlHours: "168"
logging:
  json: true
circuit:
  failureThreshold: "3"
  openMs: "60000"
api:
  id: "${secure::api.id}"
